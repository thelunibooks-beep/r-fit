  <style>
    body {
      background-color: #F6F7F5;
      color: #1E221D;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    /* Ajustes de área segura para móviles con notch */
    .safe-top {
      padding-top: max(env(safe-area-inset-top), 0.75rem);
    }
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom), 0.75rem);
    }

    /* Animación pulso grabación de voz */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 71, 54, 0.55); }
      70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(59, 71, 54, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 71, 54, 0); }
    }
    .recording-pulse {
      animation: pulse-ring 1.5s infinite;
    }

    /* Ocultar scrollbar manteniendo scroll fluido */
    .no-scrollbar::-webkit-scrollbar {

    }
    .no-scrollbar {
      -ms-overflow-style: none;
